name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test

      - name: Install cargo-about
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.3

      # The release workflow generates this file for each archive. Generating
      # it here makes a dependency under a license that about.toml does not
      # accept fail the pull request that brings it in, not the release.
      - name: Generate the third-party licenses
        run: cargo about generate --locked --fail --target "$TARGET" -c about.toml -m crates/wafu/Cargo.toml -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" about.hbs
        env:
          TARGET: ${{ matrix.target }}

      - name: Check the package.json version
        if: runner.os == 'Linux'
        run: |
          stub="$(jq -re .version package.json)"
          cargo metadata --format-version 1 --no-deps \
            | jq -re '.packages[] | .name + " " + .version' \
            | while read -r name version; do
                if [[ "$stub" != "$version" ]]; then
                  echo "::error::$name: Cargo.toml has $version but package.json has $stub"
                  exit 1
                fi
              done

  msrv:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev

      - name: Read MSRV
        id: read-msrv
        uses: actions-rust-lang/msrv@983d9d27da8fe8aaa47732160b7a14805004d4b2 # v0.1.3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.read-msrv.outputs.msrv }}

      - name: cargo check
        run: cargo check

  workflows:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: docker://ghcr.io/jdx/jactionlint:2.6.0@sha256:323474d5999ac01a4712d99a8c21d245b62f79977a1e9cc8795f321142a087d7
        with:
          args: --online
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci:
    needs:
      - check
      - msrv
      - workflows

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
