name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  windows:
    runs-on: windows-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Install cargo-about
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.3

      - name: Build
        run: cargo build --release --locked -p wafu
        env:
          RUSTFLAGS: >-
            -C target-feature=+crt-static
            -C link-arg=/DEFAULTLIB:ucrt.lib
            -C link-arg=/NODEFAULTLIB:vcruntime.lib
            -C link-arg=/NODEFAULTLIB:msvcrt.lib
            -C link-arg=/NODEFAULTLIB:libucrt.lib

      - name: Generate the third-party licenses
        run: cargo about generate --locked --fail --target x86_64-pc-windows-msvc -c about.toml -m crates/wafu/Cargo.toml -o THIRD-PARTY-LICENSES.txt about.hbs

      - name: Package
        run: |
          version="$(jq -re .version package.json)"
          stage="$RUNNER_TEMP/stage"
          mkdir "$stage" dist
          cp target/release/wafu.exe LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt "$stage/"
          (cd "$stage" && 7z a -tzip "$GITHUB_WORKSPACE/dist/wafu-v$version-windows-x64.zip" wafu.exe LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Install cargo-about
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.3

      - name: Build
        run: cargo build --release --locked -p wafu

      - name: Generate the third-party licenses
        run: cargo about generate --locked --fail --target aarch64-apple-darwin -c about.toml -m crates/wafu/Cargo.toml -o THIRD-PARTY-LICENSES.txt about.hbs

      - name: Package
        run: |
          version="$(jq -re .version package.json)"
          stage="$RUNNER_TEMP/stage"
          app="$stage/wafu.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/wafu "$app/Contents/MacOS/"
          cp crates/wafu/assets/Info.plist "$app/Contents/"
          cp crates/wafu/assets/wafu.icns "$app/Contents/Resources/"
          plutil -replace CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$version" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt "$stage/"
          mkdir dist
          # The license files also keep the archive from having a single
          # top-level directory, which Homebrew would enter before installing,
          # leaving the formula no wafu.app to install. COPYFILE_DISABLE keeps
          # tar from adding ._* files, which would invalidate the signature of
          # the bundle.
          COPYFILE_DISABLE=1 tar -czf "dist/wafu-v$version-macos-arm64.tar.gz" -C "$stage" \
            wafu.app LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      # The glibc of the oldest mainstream distribution still under vendor
      # support (the RHEL 8 family), the line Python's manylinux_2_28 draws too.
      # Anything lower would only add end-of-life systems. Raise it once that
      # family leaves support.
      GLIBC_FLOOR: "2.28"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          use-cache: false

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild@0.24.1

      - name: Install cargo-about
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.3

      # A binary runs only on a glibc at least as new as the one it was linked
      # against, and neither rustc nor cargo can choose that version: a plain
      # cargo build would require the glibc of the runner. zig links against
      # stubs of the version given after the target. Without that suffix it
      # silently uses its own default, so the suffix must stay. An older runner
      # image would lower the requirement only until the image is retired, and
      # a static musl binary cannot dlopen the window system libraries.
      - name: Build
        run: cargo zigbuild --release --locked -p wafu --target "x86_64-unknown-linux-gnu.$GLIBC_FLOOR"

      # Everything else (Wayland, X11, xkbcommon, EGL, OpenGL) is loaded with
      # dlopen. fontconfig is linked because loading it that way needs a direct
      # dependency on fontique with the version Slint uses, and falls back to
      # linking without a word when the two versions drift apart.
      - name: Check the glibc requirement and the linked libraries
        run: |
          binary=target/x86_64-unknown-linux-gnu/release/wafu
          glibc="$(readelf -W -V "$binary" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "Highest glibc version required: $glibc"
          if [[ "$(printf '%s\n' "$glibc" "$GLIBC_FLOOR" | sort -V | tail -n 1)" != "$GLIBC_FLOOR" ]]; then
            echo "::error::wafu requires glibc $glibc, which is newer than $GLIBC_FLOOR"
            exit 1
          fi
          mapfile -t needed < <(readelf -W -d "$binary" | sed -n 's/.*(NEEDED).*\[\(.*\)\]$/\1/p')
          echo "Linked libraries: ${needed[*]}"
          for library in "${needed[@]}"; do
            case "$library" in
              ld-linux-x86-64.so.2 | libc.so.6 | libdl.so.2 | libfontconfig.so.1 | libgcc_s.so.1 | libm.so.6 | libpthread.so.0) ;;
              *)
                echo "::error::wafu links $library, which is not expected to be on every host"
                exit 1
                ;;
            esac
          done

      - name: Generate the third-party licenses
        run: cargo about generate --locked --fail --target x86_64-unknown-linux-gnu -c about.toml -m crates/wafu/Cargo.toml -o THIRD-PARTY-LICENSES.txt about.hbs

      - name: Package
        run: |
          version="$(jq -re .version package.json)"
          stage="$RUNNER_TEMP/stage"
          mkdir "$stage" dist
          cp target/x86_64-unknown-linux-gnu/release/wafu crates/wafu/assets/wafu.png LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt "$stage/"
          tar -czf "dist/wafu-v$version-linux-x64.tar.gz" -C "$stage" \
            wafu wafu.png LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - windows
      - macos
      - linux

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: write # create the release and attach the files

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install changesette
        uses: iorate/changesette/setup@b370e56da41258dce8313c46a75eb4c5647f0fd6 # v7.2.2

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$(jq -re .version package.json)" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match the version of wafu"
            exit 1
          fi
          changesette get-changelog-entry wafu "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  packages:
    needs: release

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The bot app must be installed on the tap and the bucket as well, with
      # write access to their contents.
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap,scoop-bucket
          permission-contents: write

      # The formula and the manifest are written from here on every release.
      # cargo-dist could generate the formula, but its fixed template can
      # neither install an app bundle nor write the launcher script. The bucket
      # could update its manifest itself by polling for releases on a schedule,
      # but that lags behind the release.
      - name: Update the Homebrew tap and the Scoop bucket
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksum() {
            sha256sum "dist/wafu-v$version-$1" | cut -d ' ' -f 1
          }
          update() {
            local endpoint="repos/$GITHUB_REPOSITORY_OWNER/$1" file="$2" sha fields=()
            if sha="$(gh api "$endpoint" --jq .sha)"; then
              if [[ "$sha" == "$(git hash-object "$file")" ]]; then
                echo "$endpoint is already up to date" >&2
                return
              fi
              fields=(-f "sha=$sha")
            fi
            gh api -X PUT "$endpoint" -f "message=wafu $version" -f "content=$(base64 -w 0 "$file")" "${fields[@]}"
          }
          macos_arm64_sha256="$(checksum macos-arm64.tar.gz)"
          linux_x64_sha256="$(checksum linux-x64.tar.gz)"
          windows_x64_sha256="$(checksum windows-x64.zip)"
          sed -e "s/@VERSION@/$version/g" \
            -e "s/@MACOS_ARM64_SHA256@/$macos_arm64_sha256/" \
            -e "s/@LINUX_X64_SHA256@/$linux_x64_sha256/" \
            packaging/wafu.rb > "$RUNNER_TEMP/wafu.rb"
          sed -e "s/@VERSION@/$version/g" \
            -e "s/@WINDOWS_X64_SHA256@/$windows_x64_sha256/" \
            packaging/wafu.json > "$RUNNER_TEMP/wafu.json"
          update homebrew-tap/contents/Formula/wafu.rb "$RUNNER_TEMP/wafu.rb"
          update scoop-bucket/contents/bucket/wafu.json "$RUNNER_TEMP/wafu.json"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
