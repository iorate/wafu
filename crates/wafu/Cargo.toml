[package]
name = "wafu"
description = "A keyboard-driven dual-pane file manager built with Rust and Slint"
readme = "../../README.md"
keywords = ["file-manager", "dual-pane", "keyboard", "slint", "gui"]
categories = ["filesystem", "gui"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
slint.workspace = true
wafu-core.workspace = true
wafu-io.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
