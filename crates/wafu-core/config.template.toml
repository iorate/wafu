# wafu configuration
#
# Every item below is commented out and shows its default value. Uncomment an
# item to change it; whatever stays commented keeps following the built-in
# default. The section headers are not commented out, so an item only needs
# its own line uncommented. Changes take effect as soon as the file is saved.

[general]
# Enter the directory that mkdir created.
# mkdir_then_enter = true
# Make copy, move, delete, and trash act only on marked entries; with no
# marks they do nothing. Set to false to let them act on the cursor row.
# require_marks = true
# Hide the log while a preview is open.
# hide_log_in_preview = false
# The editor used by edit, new_text, and edit_config, written like the run
# item of a command (see [commands]). The default depends on the OS and is
# shown in the [os.*] sections at the end.

[appearance]
# auto follows the OS; light and dark force a theme.
# theme = "auto"
# How sizes are written: plain (bytes), comma (1,234,567), or human (1.2M,
# like ls -h).
# size_format = "plain"

# The default font. An empty family uses the system font. The size is in pixels.
[appearance.font]
# family = ""
# size = 12

# The file lists, the log, and the preview may each have their own font. An
# item that is not set here falls back to the default font. For example:
#
#   [appearance.font.filelist]
#   family = "Consolas"
#   size = 14
[appearance.font.filelist]
# family = ""
[appearance.font.log]
# family = ""
[appearance.font.preview]
# family = ""

# Colors are written as #rrggbb. fg and bg are the text and the background,
# mark the background of the marked rows, and cursor the cursor line. The
# text of a row takes, like ls --color, the first of these that applies:
# broken for a broken symbolic link, link for a symbolic link, dir for a
# directory, exec for an executable file, fifo for a FIFO or a device, socket
# for a socket, and fg otherwise. Marking a row does not change its text color.
[colors.light]
# fg = "#1e1e1e"
# bg = "#ffffff"
# mark = "#dcdcdc"
# cursor = "#1e1e1e"
# dir = "#1f5fbf"
# link = "#0e7c86"
# exec = "#2a8c2a"
# broken = "#c0392b"
# fifo = "#b8860b"
# socket = "#b03a9a"

[colors.dark]
# fg = "#d4d4d4"
# bg = "#1e1e1e"
# mark = "#3c3c3c"
# cursor = "#d4d4d4"
# dir = "#6fa8ff"
# link = "#4fd1e0"
# exec = "#5fd75f"
# broken = "#ff6b6b"
# fifo = "#f0c050"
# socket = "#e58ae0"

# The display state of the panes when there is no state file yet.
[initial]
# sort = "name"          # none / name / extension / size / time / natural
# descending = false
# dirs_first = true
# ignore_case = true
# show_hidden = false

# Bookmarks, in the order they are listed. A leading ~ is the home directory.
#
#   [[bookmarks]]
#   path = "~/Downloads"

# External commands. The run item is split at spaces; quote an argument that
# contains spaces. The command is started directly, without a shell, in the
# active pane's directory. Placeholders stand for one argument each:
#   {cursor_path}   the item under the cursor
#   {marked_paths}  every marked item
#   {paths}         the marked items, or the item under the cursor
#   {dir}           the active pane's directory
#   {other_dir}     the other pane's directory
#
#   [commands.open_terminal]
#   run = "wt -d {dir}"

# Keys. Each entry replaces the built-in binding of that key; bind nop to
# remove one. A command from [commands] is written with a leading $.
# Modifiers are Ctrl, Shift, and Alt; symbols are written as typed.
#
#   [keys.filelist]
#   "F2" = "$open_terminal"
#   "Ctrl+C" = "copy_path"
#   "Q" = "nop"
[keys.filelist]
[keys.image]
[keys.text]
[keys.binary]

# Items under [os.windows], [os.macos], and [os.linux] apply on that OS only
# and override the items above.
[os.windows.general]
# editor = "notepad {paths}"
[os.macos.general]
# editor = "open -t {paths}"
[os.linux.general]
# editor = "xdg-open {paths}"
