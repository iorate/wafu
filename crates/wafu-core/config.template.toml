## wafu configuration. Changes take effect as soon as the file is saved.
## Items are set to their defaults; a removed item falls back to its default.

[general]
mkdir_then_enter = true       # Enter the directory that mkdir created
new_text_creates_file = true  # Create the file before opening it in the editor
extract_creates_dir = true    # Extract into a directory named after the archive
require_marks = true          # Copy, move, delete, and trash act on marks only
hide_log_in_preview = false   # Hide the log while a preview is open

[appearance]
theme = "auto"                # auto, light, or dark
size_format = "plain"         # plain, comma (1,234,567), or human (1.2M)

[appearance.font]
family = ""                   # Empty for the monospaced font of the OS
size = 12                     # In pixels

## Fonts for each area, with the same items. Missing items follow
## [appearance.font].
[appearance.font.path]
# family = "Consolas"
# size = 16
[appearance.font.filelist]
[appearance.font.info]
[appearance.font.log]
[appearance.font.status]
[appearance.font.preview]
[appearance.font.popup]

## Colors of the file lists. A row's text takes the first color that applies:
## broken, link, dir, exec, fifo (also devices), socket, then fg.
[colors.light]
fg = "#1e1e1e"
bg = "#ffffff"
mark = "#dcdcdc"              # Background of marked rows
cursor = "#1e1e1e"            # Cursor line
dir = "#1f5fbf"
link = "#0e7c86"
exec = "#2a8c2a"
broken = "#c0392b"
fifo = "#b8860b"
socket = "#b03a9a"

[colors.dark]
fg = "#d4d4d4"
bg = "#1e1e1e"
mark = "#3c3c3c"
cursor = "#d4d4d4"
dir = "#6fa8ff"
link = "#4fd1e0"
exec = "#5fd75f"
broken = "#ff6b6b"
fifo = "#f0c050"
socket = "#e58ae0"

## Bookmarks, in order. A leading ~ is the home directory.
# [[bookmarks]]
# path = "~/Downloads"

## External commands, run without a shell in the active pane's directory.
## Placeholders: {cursor_path}, {marked_paths}, {paths} (marked items or the
## cursor item), {dir}, and {other_dir}.
# [commands.open_terminal]
# run = "wt -d {dir}"

## Keys that replace the built-in bindings. "nop" unbinds a key, and "$name"
## runs a command from [commands].
[keys.filelist]
# "Q" = "nop"
# "F2" = "$open_terminal"
[keys.binary]
[keys.text]
[keys.image]

## Items for one OS, overriding the items above.
[os.windows.general]
editor = "notepad {paths}"    # Used by edit, new_text, and edit_config
[os.macos.general]
editor = "open -t {paths}"
[os.linux.general]
editor = "xdg-open {paths}"
