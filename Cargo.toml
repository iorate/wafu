[workspace]
resolver = "3"
members = [
    "crates/wafu",
    "crates/wafu-core",
    "crates/wafu-io",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iorate/wafu"
authors = ["iorate"]

[workspace.dependencies]
bzip2 = "0.6.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "encoder", "xz"] }
tar = { version = "0.4.46", default-features = false }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
chardetng = "1.0.0"
chrono = "0.4.45"
clap = "4.6.8"
dirs = "7.0.0"
encoding_rs = "0.8.44"
globset = "0.4.21"
icu_collator = "2.4.0"
icu_normalizer = "2.4.0"
ignore = "0.4.34"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
notify = "8.2.2"
open = "5.4.5"
raw-window-handle = "0.6.2"
# The default xdg-portal backend on Linux needs no GTK development packages to
# build, which the gtk3 backend would.
rfd = "0.18.0"
same-file = "1.0.6"
serde = "1.0.229"
shlex = "2.0.1"
slint = { version = "1.19.0", features = ["raw-window-handle-06"] }
slint-build = "1.19.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
trash = "5.4.0"
windows = "0.62.2"
winresource = "0.1.34"
zip = { version = "9.7.0", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64"] }
wafu-core = { version = "=0.4.0", path = "crates/wafu-core" }
wafu-io = { version = "=0.4.0", path = "crates/wafu-io" }

# The release profile trades build time for a smaller, faster binary.
[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
