[workspace]
resolver = "3"
members = [
    "crates/wafu",
    "crates/wafu-core",
    "crates/wafu-io",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/iorate/wafu"
repository = "https://github.com/iorate/wafu"
authors = ["iorate"]

[workspace.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
chardetng = "1.0.0"
chrono = "0.4.45"
clap = "4.6.7"
dirs = "7.0.0"
encoding_rs = "0.8.42"
globset = "0.4.20"
icu_collator = "2.3.1"
icu_normalizer = "2.3.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
notify = "8.2.0"
open = "5.4.4"
raw-window-handle = "0.6.2"
same-file = "1.0.6"
serde = "1.0.229"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
slint-build = "1.18.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
trash = "5.2.9"
windows = "0.62.2"
winresource = "0.1.34"
zip = { version = "9.0.5", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64"] }
wafu-core = { version = "=0.1.0", path = "crates/wafu-core" }
wafu-io = { version = "=0.1.0", path = "crates/wafu-io" }

# The release profile trades build time for a smaller, faster binary.
[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
