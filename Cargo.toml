[workspace]
resolver = "3"
members = [
    "crates/wafu",
    "crates/wafu-core",
    "crates/wafu-io",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/iorate/wafu"
repository = "https://github.com/iorate/wafu"
authors = ["iorate"]
publish = false

[workspace.dependencies]
chrono = "0.4.45"
globset = "0.4.20"
icu_collator = "2.3.1"
notify = "8.2.0"
slint = "1.18.1"
slint-build = "1.18.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
wafu-core = { path = "crates/wafu-core" }
wafu-io = { path = "crates/wafu-io" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
